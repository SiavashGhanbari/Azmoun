<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آزمون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: phone frame in the middle of a quiet desk, control panel docked on the right (top on narrow screens) */
@font-face{font-family:"Yekan Bakh";src:url("src/fonts/YekanBakh-VF.ttf") format("truetype");font-weight:1 1000;font-display:swap}
:root{--desk:#DDD8CF;--panel:#F7F5F1;--card:#FFFFFF;--ink:#1D1D1B;--muted:#5F5B55;--line:#D6D0C6;--pri:#947EDC;--pri-soft:#E9E3F8;--on-pri:#FFFFFF;--bezel:#1D1D1B;
  --font:"Yekan Bakh",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#161513;--panel:#22201D;--card:#2C2A26;--ink:#F2EEE8;--muted:#B5AEA4;--line:#403C36;--pri-soft:#3A3160;--bezel:#000;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#161513;--panel:#22201D;--card:#2C2A26;--ink:#F2EEE8;--muted:#B5AEA4;--line:#403C36;--pri-soft:#3A3160;--bezel:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7;direction:rtl}
button,select{font:inherit;color:inherit}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h1{font-size:20px;font-weight:900;margin:0}
.panel p{margin:0;color:var(--muted);font-size:12.5px}
.lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{min-height:44px;border-radius:14px;border:1.5px solid var(--ink);background:var(--card);font-weight:800;font-size:13px;line-height:1.3;padding:4px 6px;cursor:pointer}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:11px;direction:ltr}
.seg button.on{background:var(--pri);color:var(--on-pri)}
.seg button.on small{color:var(--on-pri)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{font-weight:800;cursor:pointer;padding:4px 0;list-style-position:inside}
.jumps{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px}
.jumps button{border-radius:99px;border:1px solid var(--line);background:var(--card);padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.jumps button:hover{border-color:var(--ink)}
.jumps button.on{background:var(--pri-soft);border-color:var(--ink);font-weight:800}
button:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.reset{margin-top:auto;border-radius:99px;border:1.5px solid var(--ink);background:transparent;min-height:40px;font-weight:800;cursor:pointer}
.stage{display:grid;place-items:center;overflow:hidden;min-width:0;min-height:0;padding:16px}
.fit{display:grid;place-items:center}
.phone{background:var(--bezel);border-radius:48px;padding:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);transform-origin:center;flex:none}
.phone.se{border-radius:36px;padding:70px 10px}
.phone iframe{display:block;border:0;background:#ECE9E3;border-radius:38px}
.phone.se iframe{border-radius:4px}
.tag{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);direction:ltr;pointer-events:none}
@media (max-width:820px){
  html,body{height:auto}
  .wrap{grid-template-columns:1fr;height:auto}
  .panel{border-left:0;border-bottom:1px solid var(--line);overflow:visible}
  .reset{margin-top:0}
  .stage{padding:20px 0 40px;overflow:visible}
  .tag{position:static;transform:none;text-align:center;display:block;padding-bottom:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="panel">
    <div><h1>آزمون · پیش‌نمایش</h1><p>گوشی رو انتخاب کن و مستقیم بپر به هر صفحه یا حالتی که می‌خوای.</p></div>
    <div><span class="lab">گوشی</span><div class="seg" id="dev">
      <button data-d="13" class="on">iPhone 13<small>390 × 844</small></button>
      <button data-d="se">iPhone SE<small>375 × 667</small></button></div></div>
    <div><span class="lab">وضعیت دانش‌آموز توی آزمون</span><div class="seg three" id="perf">
      <button data-p="strong">قوی</button><button data-p="mid" class="on">متوسط</button><button data-p="weak">ضعیف</button></div></div>
    <div id="groups"></div>
    <button class="reset" id="reset">پاک کردن همه‌چیز و شروع از اول</button>
  </aside>
  <main class="stage" id="stage"><div class="fit" id="fit"><div class="phone" id="phone"><iframe id="app" title="اپ آزمون" width="390" height="844"></iframe></div></div></main>
</div>
<span class="tag" id="tag"></span>
<script>
const SRC = 'index.html';
const GROUPS = [
  ['خانه', [['home:available','قبل از آزمون'],['home:progress','آزمون نیمه‌کاره'],['home:wait','منتظر نتیجه'],['home:new','نتیجه اومده'],['home:story','نتیجه نیمه‌دیده'],['home:practice','وسط تمرین'],['home:done','همه‌چی تموم']]],
  ['آزمون', [['rules','قوانین'],['exam:q','سؤال اول'],['exam:mid','وسط دفترچهٔ ۱'],['exam:img','گزینهٔ تصویری'],['exam:grid','همهٔ سؤالات'],['exam:b2','دفترچهٔ ۲'],['exam:img2','گزینهٔ تصویری ۲'],['exam:last','تحویل آزمون'],['done','تحویل داده شد']]],
  ['نتیجهٔ آزمون (استوری)', [['story:stats','۱ · آمار'],['story:score','۲ · تراز و رتبه'],['story:cats','۳ · دسته‌ها'],['story:compare','۴ · مقایسه'],['story:go','۵ · دعوت به تمرین']]],
  ['تمرین', [['exams','صفحهٔ آزمون و تمرین'],['practice:explain','راه‌حل'],['practice:similar','سؤال مشابه'],['practice:ok','جواب درست'],['practice:no','جواب غلط'],['practice:end','پایان یک سطح'],['exams:done','همهٔ تمرین‌ها تموم'],['exams:before','قبل از آزمون']]],
  ['کارنامه و رتبه', [['result','کارنامه'],['report','دانلود کارنامه'],['answer','پاسخ یک سؤال'],['leaderboard','رتبه‌بندی'],['leaderboard:before','رتبه‌بندی قبل از آزمون']]],
  ['سبد و پروفایل', [['basket','سبد پر'],['basket:empty','سبد خالی'],['basket:item','یک سؤال از سبد'],['profile','پروفایل'],['avatar','انتخاب عکس'],['logout','خروج از حساب']]],
  ['ورود و ثبت‌نام', [['login','ورود'],['otp','کد پیامک'],['unregistered','شمارهٔ ثبت‌نشده'],['invite','کد دعوت'],['register:0','فرم ۱'],['register:1','فرم ۲'],['register:2','فرم ۳'],['register:3','فرم ۴'],['welcome:0','معرفی ۱'],['welcome:1','معرفی ۲'],['welcome:2','معرفی ۳']]],
];
const SIZES = { '13':[390,844,'iPhone 13'], se:[375,667,'iPhone SE'] };
const $ = s => document.querySelector(s), frame = $('#app');
let state = { d:'13', perf:'mid', go:'home:available' };
try { Object.assign(state, JSON.parse(localStorage.getItem('azmoun-preview') || '{}')); } catch(e) {}
const keep = () => { try { localStorage.setItem('azmoun-preview', JSON.stringify(state)); } catch(e) {} };

$('#groups').innerHTML = GROUPS.map(([t,items],i)=>`<details ${i<3?'open':''}><summary>${t}</summary><div class="jumps">${items.map(([id,l])=>`<button data-go="${id}">${l}</button>`).join('')}</div></details>`).join('');
function send(){ frame.contentWindow && frame.contentWindow.postMessage({ azmoun:{ go:state.go, perf:state.perf } }, '*'); }
function mark(){
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===state.go));
  document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('on', b.dataset.d===state.d));
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on', b.dataset.p===state.perf));
}
function size(){
  const [w,h,name]=SIZES[state.d], ph=$('#phone'); frame.width=w; frame.height=h; ph.classList.toggle('se', state.d==='se');
  ph.style.transform='none'; $('#fit').style.cssText='';
  const st=$('#stage'), wide=matchMedia('(min-width:821px)').matches, pw=ph.offsetWidth, phh=ph.offsetHeight;
  const k=Math.min(1, (st.clientWidth-(wide?32:24))/pw, wide ? (st.clientHeight-64)/phh : 1);
  ph.style.transform=`scale(${k})`; $('#fit').style.cssText=`width:${pw*k}px;height:${phh*k}px`;
  $('#tag').textContent=`${name} · ${w} × ${h}${k<1?' · '+Math.round(k*100)+'%':''}`;
}
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go){ state.go=b.dataset.go; send(); }
  else if(b.dataset.d){ state.d=b.dataset.d; size(); }
  else if(b.dataset.p){ state.perf=b.dataset.p; send(); }
  else if(b.id==='reset'){ state.go='login'; frame.contentWindow.postMessage({ azmoun:{ go:'reset' } }, '*'); }
  mark(); keep();
});
addEventListener('resize', size);
frame.addEventListener('load', ()=>setTimeout(send, 60));
// داخل پیش‌نمایشِ Claude فایل را می‌خوانیم و با srcdoc می‌گذاریم؛ روی فایل محلی مستقیم با src
fetch(SRC).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(t=>{ frame.srcdoc=t; }).catch(()=>{ frame.src=SRC; });
mark(); size();
</script>
</body>
</html>
