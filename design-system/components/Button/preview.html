<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><style>.pv{padding:16px;font-family:var(--font-sans);color:var(--ink)} .pv .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv .col{display:flex;flex-direction:column;gap:12px;max-width:380px} .pv .static{position:static!important;transform:none!important;left:auto!important;bottom:auto!important;animation:none!important;width:100%!important;max-width:380px!important} .pv .lbl{font-size:12px;color:var(--muted);font-weight:700}</style></head>
<body>
<div class="pv">
<div class="col">
<button class="btn btn-primary">شروع آزمون</button>
<button class="btn btn-ghost">ثبت‌نام با کد دعوت</button>
<div class="wrap"><button class="btn btn-primary btn-sm">شروع تمرین</button><button class="btn btn-ghost btn-sm">تغییر عکس پروفایل</button><button class="btn btn-ghost btn-xs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg> علامت بزن</button><button class="btn btn-ghost btn-xs flag-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg> علامت خورده</button></div>
<div class="wrap" style="flex-wrap:nowrap"><button class="btn btn-ghost btn-sq" aria-label="همهٔ سؤال‌ها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button><button class="btn btn-ghost" disabled>قبلی</button><button class="btn btn-primary">بعدی</button></div>
<div class="wrap" style="flex-wrap:nowrap"><button class="btn btn-primary loading">ورود</button><button class="btn btn-primary" disabled>دریافت کد</button></div>
<button class="btn btn-ghost btn-danger">حذف از سبد</button>
</div>
</div>
</body>
</html>
