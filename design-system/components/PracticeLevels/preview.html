<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><style>.pv{padding:16px;font-family:var(--font-sans);color:var(--ink);max-width:420px} .pv .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv .col{display:flex;flex-direction:column;gap:12px;max-width:380px} .pv .static,.pv .sticky{position:static!important;transform:none!important;left:auto!important;bottom:auto!important;animation:none!important;width:100%!important;max-width:380px!important;margin:0!important;padding:0!important} .pv *{animation-delay:0s!important} .pv .lbl{font-size:12px;color:var(--muted);font-weight:700}</style></head>
<body>
<div class="pv">
<div class="col"><button class="list-item" onclick="openPractice('easy')" style="--i: 3;"><span class="grow"><span class="row between"><b>سؤال‌های ساده</b><span class="badge pri">از اینجا</span></span><span class="muted small">۱ از ۱۷ سؤال</span><div class="progress" style="margin-top:8px"><i style="width: 6%;"></i></div></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></span></button><button class="list-item" onclick="openPractice('medium')" style="--i: 4;"><span class="grow"><span class="row between"><b>سؤال‌های متوسط</b></span><span class="muted small">۳ از ۲۰ سؤال</span><div class="progress" style="margin-top:8px"><i style="width: 15%;"></i></div></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></span></button><button class="list-item" onclick="openPractice('hard')" style="--i: 5;"><span class="grow"><span class="row between"><b>سؤال‌های سخت</b></span><span class="muted small">۱ از ۸ سؤال</span><div class="progress" style="margin-top:8px"><i style="width: 13%;"></i></div></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></span></button></div>
</div>
</body>
</html>
