<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><style>.pv{padding:16px;font-family:var(--font-sans);color:var(--ink);max-width:420px} .pv .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv .col{display:flex;flex-direction:column;gap:12px;max-width:380px} .pv .static,.pv .sticky{position:static!important;transform:none!important;left:auto!important;bottom:auto!important;animation:none!important;width:100%!important;max-width:380px!important;margin:0!important;padding:0!important} .pv *{animation-delay:0s!important} .pv .lbl{font-size:12px;color:var(--muted);font-weight:700}</style></head>
<body>
<div class="pv">
<div class="tile-grid" style="--i: 3;">
      <button class="tile " onclick="tab('leaderboard')"><span class="cap">رتبهٔ تو</span><b><span data-count="52" data-from="232">۶۸</span></b><span class="small muted">از ۲۳۲ نفر</span></button>
      <button class="tile " onclick="go('result')"><span class="cap">تراز</span><b><span data-count="5756" data-sep="1">۵٬۲۴۲</span></b><span class="small muted">دیدن کارنامه</span></button>
      <button class="tile " onclick="tab('exams')"><span class="cap">تمرین</span><b>۷<small> از ۴۵</small></b><span class="small muted">سؤال تمرین‌شده</span></button>
      <button class="tile " onclick="go('basket')"><span class="cap">سبد معلم</span><b>۲</b><span class="small muted">سؤال برای پرسیدن</span></button>
    </div>
</div>
</body>
</html>
