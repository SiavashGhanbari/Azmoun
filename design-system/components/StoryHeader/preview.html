<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><style>.pv{padding:16px;font-family:var(--font-sans);color:var(--ink);max-width:420px} .pv .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv .col{display:flex;flex-direction:column;gap:12px;max-width:380px} .pv .static,.pv .sticky{position:static!important;transform:none!important;left:auto!important;bottom:auto!important;animation:none!important;width:100%!important;max-width:380px!important;margin:0!important;padding:0!important} .pv *{animation-delay:0s!important} .pv .lbl{font-size:12px;color:var(--muted);font-weight:700}</style></head>
<body>
<div class="pv">
<div class="sticky st-hd" style="--i: 0;"><div class="st-bars"><i><b class="" style="width:100%"></b></i><i><b class="" style="width:100%"></b></i><i><b class="now" style="width:100%"></b></i><i><b class="" style="width:0%"></b></i><i><b class="" style="width:0%"></b></i></div>
    <div class="row between st-top"><button class="icon-btn" onclick="storyBack()" aria-label="صفحهٔ قبل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
      <button class="st-x" onclick="storyExit()" aria-label="بستن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div></div>
</div>
</body>
</html>
