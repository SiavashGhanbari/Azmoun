:root{
  --bg:#ECE9E3; --surface:#F7F5F1; --card:#FFFFFF; --ink:#1D1D1B; --muted:#6E6A63; --line:#D6D0C6; --track:#D9D9E3;
  --pri:#947EDC; --pri-dk:#7A63C6; --pri-soft:#E9E3F8;
  --green:#5E9A5F; --green-dk:#2F5D35; --green-soft:#DDE9D4;
  --terra:#D98F76; --terra-soft:#F4DED4; --sage:#B8CD9E; --mustard:#EBCB7E;
  --bad:#B9442F; --bad-soft:#F6DED7;
  --hard:0 3px 0 var(--ink);
  --soft:0 1px 2px rgba(40,30,10,.05),0 12px 30px -14px rgba(40,30,10,.22);
  --ease:cubic-bezier(.22,.9,.24,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* بدون اسکرول افقی؛ clip برخلاف hidden هدرهای چسبان را خراب نمی‌کند */
body{overflow-x:hidden;overscroll-behavior-x:none}
/* اسکرول‌بار مرورگر پنهان است؛ به‌جایش نشانگر باریک داخل اپ (#sbar) */
html,.sheet,.pick-list{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
#sbar{position:fixed;top:0;bottom:0;width:4px;z-index:40;pointer-events:none;opacity:0;transition:opacity .35s}
#sbar.on{opacity:1;transition-duration:.12s}
#sbar i{display:block;width:4px;border-radius:4px;background:rgba(29,29,27,.38);will-change:transform}
html{touch-action:pan-y pinch-zoom}
body{background:#DCD8D0;color:var(--ink);font-family:'Yekan Bakh',Tahoma,sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:430px;width:100%;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:clip}
.screen{min-width:0;max-width:100%}
img,svg{max-width:100%}
[hidden]{display:none!important}
.screen{flex:1;padding:16px 16px 116px}
.screen.no-nav{padding-bottom:32px}
.screen.has-act{padding-bottom:200px}
h1{font-size:26px;font-weight:800;line-height:1.4;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:20px;font-weight:800;line-height:1.45;margin:0 0 6px}
p{margin:0}
p,h1,h2,.list-item .small{text-wrap:pretty}
.muted{color:var(--muted)} .small{font-size:13px} .ltr{direction:ltr;unicode-bidi:isolate} .center{text-align:center}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.cap{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.stack>.sec{margin-top:24px}
.big{font-size:42px;font-weight:900;line-height:1.15}

/* کارت نمایشی: سایهٔ نرم — کارت کلیک‌خور: خط و سایهٔ سخت */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--soft)}
.card.flat{background:var(--surface);box-shadow:none}
.tap,.list-item{border:1.6px solid var(--ink);box-shadow:var(--hard);transition:box-shadow .14s var(--ease),background-color .2s var(--ease)}
.tap:active,.list-item:active{box-shadow:0 0 0 var(--ink)}
button.card{width:100%;text-align:right;display:block}

/* دکمه‌ها */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:999px;font-weight:800;font-size:16px;padding:0 20px;transition:transform .14s var(--ease),box-shadow .14s var(--ease),background-color .2s,opacity .2s}
.btn-primary{background:var(--pri);color:#fff;border:1.6px solid var(--ink);box-shadow:var(--hard)}
.btn-primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn-primary:disabled{opacity:.45;box-shadow:none;transform:translateY(3px);cursor:default}
.btn-ghost{background:rgba(29,29,27,.075);font-weight:700}
.btn-ghost:active:not(:disabled){transform:scale(.97);background:rgba(29,29,27,.13)}
.btn-ghost:disabled{opacity:.4;cursor:default}
@media (hover:hover){.btn-ghost:hover:not(:disabled){background:rgba(29,29,27,.11)}}
.btn-danger{color:var(--bad)}
.btn-sm{min-height:42px;font-size:14px;width:auto;padding:0 18px;display:inline-flex}
.btn-xs{min-height:34px;font-size:13px;width:auto;padding:0 14px;display:inline-flex;gap:6px}
.btn-sq{width:54px;padding:0;flex:none}
.btn svg{width:20px;height:20px} .btn-xs svg{width:16px;height:16px}
.btn.loading{color:transparent!important;position:relative;pointer-events:none}
.btn-primary.loading::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(29,29,27,.2);border-top-color:var(--ink);animation:spin .7s linear infinite}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.badge.ok{background:var(--green-soft);border-color:transparent;color:var(--green-dk)}
.badge.warn{background:var(--terra-soft);border-color:transparent;color:#8A3E26}
.badge.pri{background:var(--pri-soft);border-color:transparent;color:#4B3A92}

/* هدر ثابت */
.sticky{position:sticky;top:0;z-index:6;background:var(--bg);margin:-16px -16px 0;padding:16px 16px 10px;transition:box-shadow .25s var(--ease)}
.topbar.sticky{margin:-16px -16px 8px;padding:10px 16px 8px}
.sticky .topbar{margin-bottom:2px}
body.scrolled .sticky{box-shadow:0 1px 0 var(--line),0 10px 16px -14px rgba(40,30,10,.35)}
/* هدر */
.topbar{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.topbar .title{flex:1;font-weight:800;font-size:16px;text-align:center;line-height:1.4}
.topbar .sp{width:42px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.6px solid var(--ink);box-shadow:0 2px 0 var(--ink);flex:none;transition:transform .14s var(--ease),box-shadow .14s}
.icon-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.icon-btn svg{width:20px;height:20px}
.avatar{border-radius:50%;object-fit:cover;background:#E8E3DC;display:block}
.av-btn{border-radius:50%;border:1.6px solid var(--ink);box-shadow:0 2px 0 var(--ink);overflow:hidden;width:46px;height:46px;flex:none;transition:transform .14s,box-shadow .14s}
.av-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.av-btn img{width:100%;height:100%}

/* فرم */
.f-label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.f+.f{margin-top:16px}
.field{width:100%;height:56px;border:1.6px solid var(--line);border-radius:16px;background:var(--card);padding:0 16px;font-size:19px;letter-spacing:1px;outline:none;text-align:left;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(148,126,220,.22)}
.field.err{border-color:var(--bad)}
.field.txt{text-align:right;letter-spacing:0;font-size:16px}
.field-btn{display:flex;align-items:center;justify-content:space-between;text-align:right;letter-spacing:0;font-size:16px;cursor:pointer}
.field-btn svg{width:18px;height:18px;color:var(--muted)}
.otp{letter-spacing:18px;text-align:center;font-size:26px;font-weight:800}
.err-msg{color:var(--bad);font-size:13px;margin-top:6px}
.seg{display:flex;gap:10px}
.seg button,.chips button{flex:1;min-height:48px;border-radius:14px;border:1.6px solid var(--ink);background:var(--card);font-weight:700;box-shadow:0 2px 0 var(--ink);transition:transform .12s,box-shadow .12s,background-color .2s}
.seg button:active,.chips button:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.seg button.on,.chips button.on{background:var(--pri);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{flex:none;padding:0 18px;min-height:42px;border-radius:999px}
.f.has-err .seg button,.f.has-err .chips button{border-color:var(--bad)}

/* فهرست */
.list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:22px;width:100%;text-align:right;min-height:72px;overflow:hidden}
.list-item b{font-size:16px}
.list-item.compact{min-height:56px;padding:10px 16px}
.thumb{width:76px;height:58px;flex:none;margin:-8px -6px -8px -8px;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.chev{color:var(--muted);display:grid;place-items:center}
.chev svg{width:20px;height:20px}

/* تصویرسازی */
.illus{display:grid;place-items:center}
.illus svg{width:190px;height:auto}
.illus.sm svg{width:150px}

/* نوار پایین شناور */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:var(--card);border-radius:999px;box-shadow:0 8px 28px -6px rgba(30,25,15,.25),0 0 0 1px rgba(0,0,0,.04);display:flex;padding:6px;z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:7px 0 5px;position:relative;border-radius:999px;isolation:isolate;transition:transform .15s}
.nav button:active{transform:scale(.92)}
.nav button svg{width:22px;height:22px;transition:transform .3s var(--spring)}
.nav button.on{color:var(--ink);font-weight:800}
.nav button.on svg{transform:translateY(-1px)}
.nav button .pill{position:absolute;inset:0;border-radius:999px;background:var(--pri-soft);z-index:-1;animation:pill .35s var(--spring)}
.dot{position:absolute;top:3px;left:calc(50% - 20px);background:var(--terra);font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:1.5px solid var(--card)}

/* نوار اکشن پایین صفحه */
.actions,.exam-foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:26px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 74%,rgba(236,233,227,0));display:flex;flex-direction:column;gap:10px;z-index:5;animation:footIn .45s var(--ease) both}
.row2{display:flex;gap:10px} .row2>*{flex:1}
.exam-foot{flex-direction:row}
.exam-foot .btn{flex:1}
.exam-foot .btn-sq{flex:none}

/* آزمون */
.timer{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:58px;text-align:left;transition:color .3s}
.timer.low{color:var(--bad)}
.q-text{font-size:20px;font-weight:800;line-height:1.95;text-align:right;text-wrap:pretty;margin:6px 0 4px}
.q-img{display:block;width:100%;background:#fff;border:1.6px solid var(--ink);border-radius:18px;box-shadow:var(--hard);padding:10px 10px 46px;position:relative;margin-top:8px;transition:box-shadow .14s}
.q-img:active{box-shadow:0 0 0 var(--ink)}
.q-img img{display:block;max-width:100%;max-height:210px;margin:0 auto}
.q-img .zoom{position:absolute;left:10px;bottom:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;display:flex;align-items:center;gap:4px}
.q-img .zoom svg{width:14px;height:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px 12px 20px;background:var(--card);border:1.6px solid var(--ink);border-radius:999px;font-size:17px;font-weight:600;box-shadow:var(--hard);min-height:56px;transition:box-shadow .14s var(--ease),transform .14s var(--ease),background-color .25s var(--ease),border-color .25s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.opt .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.4px solid var(--ink);font-weight:800;font-size:14px;flex:none;transition:background-color .2s,color .2s}
.opt.sel{background:var(--pri);color:#fff}
.opt.sel .n{background:var(--ink);color:#fff}
.opt.right{background:var(--green-soft);border-color:var(--green-dk);box-shadow:0 3px 0 var(--green-dk)}
.opt.right .n{background:var(--green-dk);color:#fff;border-color:var(--green-dk)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.opt.wrong .n{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt.static{box-shadow:none;min-height:50px}
.flag-on{background:var(--terra-soft);color:#8A3E26}
.flag-on svg path{fill:currentColor}

/* پراگرس آزمون */
.xtrack{position:relative;display:flex;align-items:center;gap:6px;padding-left:48px;height:44px;margin:2px 0 6px}
.seg-b{position:relative;height:12px;border-radius:99px;background:var(--track)}
.seg-b>i{position:absolute;top:0;right:0;height:100%;border-radius:99px;background:var(--green);transition:width .6s var(--ease)}
.seg-b.done>i{background:#8DB68E}
.knob{position:absolute;top:50%;right:clamp(-8px,calc(var(--p)*1% - 19px),calc(100% - 34px));transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--green-dk);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;z-index:2;box-shadow:0 2px 6px rgba(47,93,53,.35);transition:right .55s var(--spring)}
.xend{position:absolute;left:0;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:900;font-size:15px}

/* شبکهٔ سؤال‌ها */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;justify-items:center}
.cell{width:54px;height:54px;border-radius:50%;border:1.6px solid var(--ink);background:var(--card);font-weight:800;position:relative;box-shadow:0 2px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.cell:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.cell.ans{background:var(--pri);color:#fff}
.cell.cur{outline:3px solid var(--pri);outline-offset:3px}
.cell .f{position:absolute;top:-2px;left:0;width:14px;height:14px;border-radius:50%;background:var(--terra);border:1.6px solid var(--ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px;vertical-align:-1px;border:1.4px solid var(--ink)}
.bk-steps{display:flex;align-items:stretch;gap:8px}
.bk-steps .st{flex:1;background:var(--surface);border-radius:16px;padding:12px 10px;text-align:center}
.bk-steps .ar{align-self:center;color:var(--muted);display:grid}
.bk-steps .ar svg{width:18px;height:18px}

/* شیت و توست */
.overlay{position:fixed;inset:0;background:rgba(29,29,27,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:430px;border-radius:28px 28px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.handle-zone{padding:6px 0 16px;touch-action:none;cursor:grab}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet .acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.toast.top{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90%;text-align:center}

/* نمره و آمار */
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--track);stroke-width:8}
.ring .val{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);animation:ringIn 1.2s var(--ease) both}
.ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.ring-t b{font-size:21px;font-weight:900}
.ring-t span{font-size:11px;color:var(--muted)}
.lv+.lv{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.lv .num{font-weight:900;font-size:18px}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .7s var(--ease)}
.progress{height:8px;background:var(--track);border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .6s var(--ease)}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none;font-weight:800}
.mark.x{background:var(--bad)} .mark.v{background:var(--green-dk)} .mark.n{background:var(--track);color:var(--ink)}

/* رتبه‌بندی */
.podium{display:flex;direction:ltr;align-items:flex-end;gap:10px;padding:10px 6px 0}
.pod{flex:1;text-align:center;direction:rtl;min-width:0}
.pod .avatar{width:58px;height:58px;border:1.6px solid var(--ink);margin:0 auto 6px}
.pod.p1 .avatar{width:72px;height:72px}
.pod.me .avatar{outline:3px solid var(--pri);outline-offset:2px}
.pod .crown{width:26px;height:20px;margin:0 auto 2px;display:block}
.pod .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:12px;color:var(--muted);margin-bottom:8px}
.pod .blk{border:1.6px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;display:grid;place-items:center;font-weight:900;font-size:28px;transform-origin:bottom;animation:podUp .7s var(--spring) both}
.p1 .blk{height:118px;background:var(--pri);color:#fff;animation-delay:.18s}
.p2 .blk{height:86px;background:var(--sage)}
.p3 .blk{height:62px;background:var(--terra);animation-delay:.32s}
.podium-card{padding:12px 12px 0;overflow:hidden}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-row .avatar{width:36px;height:36px}
.lb-row.me{background:var(--pri-soft);border-radius:16px;border-bottom:0;padding:10px 10px;margin:4px 0}
.rank{width:30px;font-weight:900;text-align:center;font-size:16px}
.gap{text-align:center;color:var(--muted);padding:2px 0;letter-spacing:4px}

/* پروفایل */
.pf-head{text-align:center;padding:22px 16px}
.pf-av{position:relative;width:108px;height:108px;margin:0 auto 12px}
.pf-av .avatar{width:108px;height:108px;border:1.6px solid var(--ink)}
.pf-av .edit{position:absolute;left:-2px;bottom:2px;width:36px;height:36px}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.av-opt{border-radius:50%;border:1.6px solid var(--ink);overflow:hidden;aspect-ratio:1;box-shadow:0 2px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.av-opt:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.av-opt.on{outline:3px solid var(--pri);outline-offset:3px}
.av-opt img{width:100%;height:100%;object-fit:cover;display:block}

/* مسیر مأموریت‌ها */
.tl{position:relative;padding:8px 0}
.tl::before{content:"";position:absolute;right:14px;top:12px;bottom:12px;width:36px;border-radius:18px;background:var(--green-soft)}
.tl-step{position:relative;display:flex;gap:14px;padding:12px 15px;align-items:flex-start}
.tl-step.done::before{content:"";position:absolute;right:14px;top:0;bottom:0;width:36px;background:#BFD7AE}
.tl-step.done:first-child::before{top:4px;border-radius:18px 18px 0 0}
.tl-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;z-index:1;margin-right:-1px}
.tl-ic svg{width:18px;height:18px}
.tl-step.done .tl-ic{background:var(--green-dk);color:#fff}
.tl-step.cur .tl-ic{background:var(--pri);border:1.6px solid var(--ink);color:#fff}
.tl-step.next .tl-ic{color:var(--muted)}
.tl-step.done b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.tl-step.next b{color:var(--muted)}

/* چرخ تاریخ */
.wheel{position:relative;display:flex;gap:6px;height:220px;margin-top:10px;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel-band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:14px;background:var(--pri-soft);border:1.4px solid var(--ink);pointer-events:none}
.wheel-col{flex:1;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;overscroll-behavior:contain}
.wheel-col::-webkit-scrollbar{display:none}
.wsp{height:88px}
.wi{height:44px;scroll-snap-align:center;display:grid;place-items:center;font-size:17px;font-weight:600;cursor:pointer}
.wi.on{font-weight:900}

/* مراحل ثبت‌نام و معرفی */
.steps{display:flex;gap:6px;padding:4px 0 2px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--track);transition:background-color .4s var(--ease)}
.steps i.done{background:var(--green)}
.steps i.cur{background:var(--pri)}
.wel-art{margin:40px 0 22px}
.wel-art svg{width:240px}
.wel-text{font-size:16px;line-height:2;max-width:330px;margin:6px auto 0}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.dots button{width:8px;height:8px;border-radius:8px;background:var(--line);transition:width .35s var(--spring),background-color .3s}
.dots button.on{width:26px;background:var(--ink)}
#wel{touch-action:pan-y}

/* حالت‌ها */
.empty{text-align:center;padding:20px 12px}
.empty .illus{margin-bottom:10px}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note svg{flex:none;margin-top:3px}
.success-ic{width:84px;height:84px;border-radius:50%;background:var(--green-soft);border:1.6px solid var(--ink);color:var(--green-dk);display:grid;place-items:center;margin:8px auto 16px;position:relative;animation:pop .5s var(--spring) both}
.success-ic.sm{width:64px;height:64px;margin:4px auto 10px}
.success-ic svg{width:40px;height:40px}
.success-ic.sm svg{width:30px;height:30px}
.success-ic::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--green-dk);animation:ring 1s .2s var(--ease) both}
.success-ic path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .3s var(--ease) forwards}
.confetti{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:40}


/* ============ افزوده‌ها ============ */
/* هدر آزمون: شمارهٔ سؤال و «همهٔ سؤالات» */
.x-sub{margin-top:-2px;min-height:36px}
/* گزینه‌های تصویری */
.opts-img{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.img{flex-direction:column;justify-content:center;gap:6px;border-radius:22px;padding:14px 10px 12px;position:relative;min-height:0}
.opt.img .n{position:absolute;top:8px;right:8px;width:26px;height:26px;font-size:13px}
.opt-img{display:block;width:100%;max-width:118px;aspect-ratio:1;margin:0 auto}
.opt.img.sel{background:var(--pri-soft);color:var(--ink);box-shadow:0 3px 0 var(--ink);outline:3px solid var(--pri);outline-offset:-5px}
.opt.img.static{min-height:0}
.opt.mine{background:var(--pri-soft)}
.tag{font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{color:var(--green-dk)} .tag.bad{color:var(--bad)} .tag.me{color:#4B3A92}
/* انتخاب استان، شهر و مدرسه */
.field-btn:disabled{opacity:.55;cursor:default;background:var(--surface)}
.pick-search{position:relative;margin:10px 0 6px}
.pick-search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.pick-search .field{padding-right:44px;height:50px}
.pick-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pick-it{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-radius:16px;background:var(--card);border:1.6px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-weight:700;text-align:right;transition:transform .12s,box-shadow .12s}
.pick-it:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.pick-it.on{background:var(--pri);color:#fff}
.pick-it svg{width:20px;height:20px}
/* دکمهٔ سبد */
.basket-btn{position:relative;overflow:visible}
.basket-btn .cnt,.basket-big .cnt{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--terra);color:var(--ink);border:1.6px solid var(--ink);font-size:12px;font-weight:900;display:grid;place-items:center;line-height:1}
.pop-in{animation:pop .45s var(--spring)}
/* خانه: برترین‌های کشور */
.top3>*+*{margin-top:12px}
.t3-list{display:flex;flex-direction:column}
.t3-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.t3-row:last-child{border-bottom:0}
.t3-row .avatar{width:36px;height:36px;flex:none}
.t3-row.me{background:var(--pri-soft);border-radius:16px;border-bottom:0;padding:8px 10px;margin-top:2px}
.medal{min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--surface);border:1.4px solid var(--ink);flex:none}
.medal.m1{background:var(--pri);color:#fff} .medal.m2{background:var(--sage)} .medal.m3{background:var(--terra)} .medal.me{background:var(--card)}
.res-new .illus svg{animation:bob 4s ease-in-out infinite, glowIn .8s var(--spring) both}
.pulse{animation:pulse 2.2s 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:var(--hard)}50%{box-shadow:0 3px 0 var(--ink),0 0 0 8px rgba(148,126,220,.22)}}
@keyframes glowIn{from{transform:scale(.6) rotate(-8deg);opacity:0}}

/* ============ قصهٔ نتیجه ============ */
.st-hd{padding-top:12px}
.st-bars{display:flex;gap:5px}
.st-bars i{flex:1;height:5px;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
.st-bars i.rv{flex:3}
.st-bars b{position:absolute;inset:0 0 0 auto;background:var(--ink);border-radius:5px;transition:width .5s var(--ease)}
.st-bars b.now{animation:fillSeg .7s var(--ease) both}
@keyframes fillSeg{from{width:0}}
.st-top{margin-top:10px;min-height:44px}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 12px 4px 6px;box-shadow:var(--soft);font-weight:900;font-size:16px}
.stars svg{width:24px;height:24px}
.st-x{width:32px;height:32px;border-radius:50%;background:rgba(29,29,27,.06);color:var(--muted);display:grid;place-items:center;opacity:.75;transition:transform .14s}
.st-x:active{transform:scale(.9)}
.st-x svg{width:15px;height:15px}
.st-body{padding-top:18px}
.st-body>*+*{margin-top:12px}
.st-h{font-size:27px;line-height:1.5;text-wrap:balance}
.st-lead{font-size:16px;line-height:2;max-width:340px;margin-inline:auto}
.hl{display:inline-block;background:var(--green-soft);color:var(--green-dk);border-radius:12px;padding:0 10px;font-variant-numeric:tabular-nums}
.st-line{animation:rise .5s var(--ease) both;animation-delay:var(--d)}
/* آمار: کاشی‌ها یکی‌یکی برمی‌گردند */
.tiles-wrap{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:22px auto 6px!important}
.tiles-b{display:flex;flex-direction:column;gap:4px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;perspective:400px}
.tiles i{display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--ink)}
.tiles i.bad{color:#fff}
.ladder{padding:6px 14px}
.ld-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);animation:rise .45s var(--ease) both;animation-delay:var(--d)}
.ld-row:last-child{border-bottom:0}
.ld-n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri-soft);border:1.4px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:14px;direction:ltr}
.ld-row .cbar{margin-top:6px;height:8px}
.ld-row .cbar i{background:var(--green)}
.tiles i{aspect-ratio:1;border-radius:8px;border:1.4px solid var(--ink);background:var(--card);animation:flipIn .5s var(--spring) both;animation-delay:var(--d)}

.chip-up.plain{background:var(--card);color:var(--ink);box-shadow:var(--soft)}

.neg{margin-top:16px!important}
.tip{font-weight:800;text-align:center}
.lv-chips{display:flex;gap:10px;justify-content:center;margin-top:18px!important}
.lv-chip{display:flex;flex-direction:column;align-items:center;min-width:84px;padding:8px 10px;border-radius:18px;background:var(--card);box-shadow:var(--soft);font-size:13px;font-weight:700;animation:popUp .5s var(--spring) both;animation-delay:var(--d)}

.basket-btn.lg{width:46px;height:46px}
.basket-btn.lg svg{width:22px;height:22px}

.stn-card .progress{display:block;margin-top:6px}

.path-end{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:700}
.path-end .stn-node{box-shadow:none;border-style:dashed;background:var(--bg)}
.path-end.on{color:var(--green-dk)} .path-end.on .stn-node{background:var(--green);border-style:solid}
.hearts{display:inline-flex;gap:3px;direction:ltr}
.hearts i{display:grid;width:26px;height:26px}

.heart-break{animation:hbreak .6s var(--ease)}
@keyframes hbreak{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.7) rotate(8deg)}100%{transform:none}}
.gdots{display:flex;gap:5px;margin-top:4px}
.gdots i{flex:1;height:8px;border-radius:8px;background:var(--track);transition:background-color .25s,transform .25s var(--spring)}
.gdots i.ok{background:var(--green)} .gdots i.bad{background:var(--bad)} .gdots i.cur{background:var(--ink);transform:scaleY(1.4)}
.gdots.big{max-width:280px;margin:18px auto 0!important}

.gtime-row{display:flex;align-items:center;gap:10px;margin-top:10px}

.streak{display:inline-flex;align-items:center;gap:4px;background:var(--mustard,#EBCB7E);border:1.4px solid var(--ink);border-radius:99px;padding:1px 10px 1px 8px;font-weight:900;font-size:13px;color:var(--ink)}

.gcard{padding:18px 16px;text-align:center}
.gcard .q-text{text-align:center}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.gopts .opt{min-height:60px}
.ask.yes{color:var(--green-dk)}
.gcount{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.gcount b{font-size:120px;font-weight:900;line-height:1;width:180px;height:180px;display:grid;place-items:center;border-radius:50%;background:var(--pri);color:#fff;border:1.6px solid var(--ink);box-shadow:var(--hard)}

.speed .st-stats .stt b{font-size:28px}

/* ============ موشن ============ */
.screen.enter-fwd{animation:inFwd .42s var(--ease) both}
.screen.enter-back{animation:inBack .42s var(--ease) both}
.screen.enter-tab>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.qwrap.q-next{animation:qNext .35s var(--ease) both}
.qwrap.q-prev{animation:qPrev .35s var(--ease) both}
.opt.sel .n,.opt.right .n{animation:pop .4s var(--spring)}

.flag-on svg{animation:wave .6s var(--ease);transform-origin:20% 100%}
.bump{animation:bump .45s var(--spring)}
.knob.bump{animation:knobBump .45s var(--spring)}

.overlay{animation:fadeIn .25s var(--ease) both}

.sheet.dragging{animation:none;transition:none}
.toast{animation:toastIn .35s var(--spring) both}
.toast.out{animation:toastOut .25s var(--ease) both}
.illus svg{animation:bob 4s ease-in-out infinite}
.art-spark{animation:twinkle 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.dot{animation:pop .4s var(--spring)}
@keyframes inFwd{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes footIn{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes qNext{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes qPrev{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}

@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes knobBump{0%{transform:translateY(-50%) scale(1)}40%{transform:translateY(-50%) scale(1.25)}100%{transform:translateY(-50%) scale(1)}}
@keyframes pill{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:translateY(var(--dy,0))}to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}

@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.6);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
/* ============ ابزار ============ */
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = v => String(v).replace(/\d/g, d => FA[d]);
const toEn = s => String(s).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const mmss = ms => { const t=Math.max(0,Math.ceil(ms/1000)); return fa(String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')); };
const fmtPhone = p => fa(p.replace(/^(\d{4})(\d{3})(\d{4})$/,'$1 $2 $3'));
const maskPhone = p => fa(p.slice(0,4)+'****'+p.slice(-3));
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const faN = n => fa(Math.round(n).toLocaleString('en-US')).replace(/,/g,'٬');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// جلوگیری از تنها ماندن یک کلمه یا علامت در خط آخر
const nob = t => { const w=String(t).replace(/\s+/g,' ').trim().split(' '); const n=/^[\p{P}\p{S}]+$/u.test(w[w.length-1])?3:2; if(w.length<=n) return w.join(' '); return w.slice(0,-n).join(' ')+' '+w.slice(-n).join(' '); };

const SVGI = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;

  [['seqA',7],['seqG',5],['seqS',5],['day',5],['queue',5],['age',5],['sym',5],['clock',3],['analogy',5],['odd',5]],
  [['frac',6],['perc',6],['rate',5],['peri',5],['area',5],['avg',5],['gcd',4],['mins',4],['sci',10]],
];
const Q = (() => {
  const out=[], noise=rngOf(31);
  PLAN.forEach((plan,b)=>{
    HQ.filter(q=>q.b===b).forEach(q=>out.push({ ...q, k:HQ_KIND[HQ.indexOf(q)], beta:({easy:-1,medium:0,hard:1})[q.d] }));
    const gen=[], seen=new Set(out.map(q=>q.q));
    plan.forEach(([k,n])=>{ for(let j=0, s=0; j<n; s++){ const li=LISTS[k]?j:null, x=GEN[k](rngOf(1000+b*500+s*17+k.length*131+j), li ?? undefined);

  });

  out.forEach(q=>{ q.beta += (q.b===0 ? 1 : 0) + (noise()-.5)*1.1; });

const POP = (() => {
  const r=rngOf(77), N=DATA.exam.others, ok=Array(Q.length).fill(0), list=[];
  const norm=()=>{ let s=0; for(let i=0;i<6;i++) s+=r(); return (s-3)/.707; };
  for(let n=0;n<N;n++){ const th=norm(), c=[0,0], w=[0,0];
    Q.forEach((q,i)=>{ if(r() < 1/(1+Math.exp(-1.3*(th-q.beta)))){ c[q.b]++; ok[i]++; } else if(r()<.45){ if(r()<.25){ c[q.b]++; ok[i]++; } else w[q.b]++; } });
    list.push({ name:NAMES[(n*5+3)%NAMES.length]+' '+INITS[(n*7+2)%INITS.length]+'.', city:CAPS[(n*11+4)%CAPS.length], av:(n*5+2)%ASSET.avatars.length, score:scoreOf(c,w) }); }
  // سطح سؤال: ۵۰٪ به بالا درست زده باشند = ساده، ۳۰ تا ۵۰٪ = متوسط، کمتر = سخت
  Q.forEach((q,i)=>{ q.rate=ok[i]/N; q.d = q.rate>=.5 ? 'easy' : q.rate>=.3 ? 'medium' : 'hard'; });
  list.sort((a,b)=>b.score-a.score);
  const mean=list.reduce((s,x)=>s+x.score,0)/N, sd=Math.sqrt(list.reduce((s,x)=>s+(x.score-mean)**2,0)/N);
  return { list, mean, sd };
})();

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove()); clearTimeout(toastTimer);
  const t=document.createElement('div'); t.className='toast'+($('#layer .overlay:not(.closing)')?' top':''); t.textContent=msg; document.body.appendChild(t);
  toastTimer=setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),260); },2300);
}
function sheet(html){
  $('#layer').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle-zone"><div class="handle"></div></div>${html}</div></div>`;
  dragSheet($('#layer .sheet'));
}
function closeSheet(){ const o=$('#layer .overlay'); if(!o || o.classList.contains('closing')) return; o.classList.add('closing'); setTimeout(()=>o.remove(),230); }
function dragSheet(el){
  const z=el.querySelector('.handle-zone'); let y0=null, dy=0;
  z.addEventListener('pointerdown', e=>{ y0=e.clientY; dy=0; el.classList.add('dragging'); z.setPointerCapture(e.pointerId); });
  z.addEventListener('pointermove', e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); el.style.transform=`translateY(${dy}px)`; el.parentNode.style.background=`rgba(29,29,27,${.35*Math.max(0,1-dy/300)})`; });
  const end=()=>{ if(y0===null) return; y0=null; el.classList.remove('dragging');
    if(dy>90){ el.style.setProperty('--dy',dy+'px'); el.style.transform=''; closeSheet(); }
    else { el.style.transition='transform .3s var(--ease)'; el.style.transform=''; el.parentNode.style.background=''; setTimeout(()=>el.style.transition='',300); } };
  z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end);
}
function kick(sel, cls){ const el=typeof sel==='string'?$(sel):sel; if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function burst(x, y){
  const colors=['#947EDC','#B8CD9E','#E2A48F','#EBCB7E','#1D1D1B'];
  for(let i=0;i<22;i++){
    const d=document.createElement('i'); d.className='confetti'; d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=colors[i%colors.length]; document.body.appendChild(d);
    const a=Math.random()*Math.PI*2, r=70+Math.random()*90;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+60}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();
  }
}
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, from=+(el.dataset.from||0), suf=el.dataset.suffix||'', f=el.dataset.sep?faN:fa, delay=+(el.dataset.delay||0), dur=+(el.dataset.dur||900);
    el.textContent=f(from)+suf;
    setTimeout(()=>{ const t0=performance.now();
      const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=f(Math.round(from+(to-from)*e))+suf; if(k<1) requestAnimationFrame(step); else if(delay) kick(el,'bump'); };
      requestAnimationFrame(step); }, delay);
  });
}
function growBars(root){ root.querySelectorAll('.bar>i,.progress>i,.seg-b>i').forEach(el=>{ const w=el.style.width; el.style.transition='none'; el.style.width='0'; void el.offsetWidth; el.style.transition=''; requestAnimationFrame(()=>el.style.width=w); }); }
function morph(a, b){
  if(a.nodeType!==b.nodeType || a.nodeName!==b.nodeName){ a.replaceWith(b); return; }
  if(a.nodeType===3){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  if(a.nodeType!==1) return;
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  morphKids(a, b);
}
function morphKids(a, b){ const ac=[...a.childNodes], bc=[...b.childNodes]; bc.forEach((n,i)=>{ if(ac[i]) morph(ac[i], n); else a.appendChild(n); }); for(let i=bc.length;i<ac.length;i++) ac[i].remove(); }

function result(a=S.exam.answers){
  const c=[0,0], w=[0,0], u=[0,0], wrong=[], by={easy:[0,0],medium:[0,0],hard:[0,0]};
  Q.forEach((q,i)=>{ by[q.d][1]++; if(a[i]===q.a){ c[q.b]++; by[q.d][0]++; } else { wrong.push(i); a[i]===null ? u[q.b]++ : w[q.b]++; } });
  const score=scoreOf(c,w);
  return { c, w, u, correct:c[0]+c[1], bad:w[0]+w[1], blank:u[0]+u[1], total:Q.length, pb:BOOKLETS.map(b=>bPct(c[b],w[b],NB[b])), score, taraz:tarazOf(score), rank:rankOf(score), wrong, by };
}

const pracDone = lv => pracList(lv).filter(i=>S.practice.res[i]).length;

function stations(){ const out=[];
  LEVELS.forEach(lv=>{ const t=pracList(lv).length, d=pracDone(lv); if(t) out.push({ type:'lv', key:lv, title:`سؤال‌های ${DIFF[lv]}`, total:t, done:d, ok:d===t }); });
  speedTopics().forEach(t=>{ const sp=S.practice.speed[t]||{}; out.push({ type:'speed', key:t, title:TOPIC[t], ok:!!sp.won, best:sp.best, tries:sp.tries||0 }); });
  return out; }
const pracAll = () => { const s=stations(); return [s.filter(x=>x.ok).length, s.length]; };
const pracState = () => { const s=stations(), d=s.filter(x=>x.ok).length; return !s.length ? 'none' : d===s.length ? 'done' : (d || s.some(x=>x.done||x.tries)) ? 'progress' : 'new'; };

function fillCol(id, items, sel, onPick){
  const c=$('#'+id); c.innerHTML = `<div class="wsp"></div>${items.map((t,i)=>`<div class="wi" data-i="${i}">${t}</div>`).join('')}<div class="wsp"></div>`;

  if(!c._bound){ c._bound=true; let tm;
    c.addEventListener('scroll',()=>{ const i=markCol(c); clearTimeout(tm); tm=setTimeout(()=>{ c._pick(i); },110); if(i!==c._last){ c._last=i; haptic(4); } });
    c.addEventListener('click',e=>{ const w=e.target.closest('.wi'); if(w) c.scrollTo({top:+w.dataset.i*44,behavior:'smooth'}); }); }

function markCol(c){ const pos=c.scrollTop/44, items=c.querySelectorAll('.wi'), i=Math.min(items.length-1,Math.max(0,Math.round(pos)));
  items.forEach((e,j)=>{ const dd=Math.abs(j-pos); e.style.opacity=Math.max(.25,1-dd*.28).toFixed(2); e.classList.toggle('on',j===i); }); return i; }

const passedCount = () => Q.filter((q,i)=>passedOf(i)).length;
function pick(gi,j){ const e=S.exam; e.answers[gi] = e.answers[gi]===j ? null : j; save(); render(); haptic(); }
function toggleFlag(gi){ S.exam.flags[gi]=!S.exam.flags[gi]; save(); render(); haptic(); }
function markPassed(){ const e=S.exam, before=passedCount(); e.passed[QB(e.booklet)[e.idx[e.booklet]].i]=true; return passedCount()!==before; }
function slideQ(d, bumped){ render(); kick('.qwrap', d>0?'q-next':'q-prev'); if(bumped) kick('.knob','bump'); top0(); }
function move(d){ const e=S.exam, b=e.booklet, k=Math.min(Math.max(0,e.idx[b]+d),QB(b).length-1); if(k===e.idx[b]) return; const bm=markPassed(); e.idx[b]=k; save(); slideQ(d,bm); }
function jump(k){ const e=S.exam, d=k-e.idx[e.booklet]; closeSheet(); if(!d) return; const bm=markPassed(); e.idx[e.booklet]=k; save(); slideQ(d,bm); }
function examGrid(){

}
function leaveExam(){ sheet(`<h2>از آزمون بیرون می‌ری؟</h2><p class="muted">جواب‌هات ذخیره می‌مونه، ولی تایمر متوقف نمی‌شه.</p>

function firstUnanswered(){ const e=S.exam,b=e.booklet,list=QB(b),k=list.findIndex(x=>e.answers[x.i]===null); closeSheet(); if(k>=0 && k!==e.idx[b]){ const d=k-e.idx[b]; e.idx[b]=k; save(); slideQ(d); } }

// گزینهٔ فقط‌نمایشی: جواب تو (و اگر showRight، جواب درست)
function staticOpt(q,j,my,showRight){ const right=showRight&&j===q.a, mine=j===my;
  const tag = right?'<span class="tag ok">جواب درست</span>':mine?`<span class="tag ${showRight?'bad':'me'}">جواب تو</span>`:'';
  return `<div class="opt static ${q.oi?'img':''} ${right?'right':mine?(showRight?'wrong':'mine'):''}" style="animation:none"><span class="n">${right?'✓':mine&&showRight?'✕':fa(j+1)}</span>${q.oi?optIn(q,j):`<span class="grow">${q.o[j]}</span>`}${tag}</div>`; }

/* ---------- نتیجهٔ آزمون: قصهٔ چندصفحه‌ای ---------- */
const STEPS = () => { const r=result(); return r.wrong.length ? ['stats','score','cats',...(r.bad?['compare']:[]),'go'] : ['stats','score','go']; };
const storyState = () => !S.story ? 'new' : S.story.done ? 'done' : 'progress';
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
// replay: دوباره دیدن قصه از اول، بدون اینکه «دیده‌شده» بودنش عوض شود
function startStory(replay){ if(!S.story) S.story={ step:0, done:false }; else if(replay && S.story.done) S.story.step=0; save(); go('story'); }
function storyNext(){ const st=S.story, n=STEPS().length; if(st.step>=n-1) return; st.step++; if(st.step===n-1) st.done=true; save(); rerender('fwd'); haptic(); }
function storyBack(){ const st=S.story; if(!st.step) return; st.step--; save(); rerender('back'); haptic(); }
function storyClose(){ closeSheet(); stack=[]; go('home',{},false); }
function storyExit(){ if(S.story.done) return storyClose();
  sheet(`<h2>بقیه‌ش رو بعداً می‌بینی؟</h2><p class="muted">همین‌جا نگهش می‌داریم. از خانه می‌تونی ادامه بدی.</p>
  <div class="acts"><button class="btn btn-primary" onclick="closeSheet()">ادامه می‌دم</button><button class="btn btn-ghost" onclick="storyClose()">بیرون می‌رم</button></div>`); }
function wrongByTopic(){ const m={}; result().wrong.forEach(i=>{ const t=Q[i].t; m[t]=(m[t]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function storyHead(){ const st=S.story, steps=STEPS();

  }
  const qi=c.qi, q=Q[qi], my=S.exam.answers[qi], ph=c.phase, sq=SIM(qi);

    act = ph==='similar' ? '' : ph==='ok' ? `<button class="btn btn-primary" onclick="pracNext('ok')">${done+1>=list.length?'تموم شد!':'سؤال بعدی'}</button>`

function pracSimilar(){ S.practice.cur.phase='similar'; save(); render(); kick('.qwrap','q-next'); top0(); haptic(); }
function pracBack(){ const c=S.practice.cur; if(c && c.phase==='similar' && pracCur(route.p.lv)) return pracExplain(); back(); }
function pracExplain(){ S.practice.cur.phase='explain'; save(); render(); kick('.qwrap','q-prev'); top0(); }
function pracPick(j){ const c=S.practice.cur, sq=SIM(c.qi); if(c.phase!=='similar') return; c.pick=j;
  if(j===sq.a){ c.phase='ok'; save(); render(); haptic(15); const o=document.querySelectorAll('#rvCard .opt')[j]; if(o){ const r=o.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); } kick('.got','pop-in'); }
  else { c.phase='no'; save(); render(); kick(document.querySelectorAll('#rvCard .opt')[j],'shake'); haptic(30); } }
function pracNext(res){ const c=S.practice.cur; S.practice.res[c.qi]=res; S.practice.cur=null; save(); render(); kick('.qwrap','q-next'); top0(); if(!pracCur(route.p.lv)){ NAV='fwd'; render(); const t=$('.end-art'); if(t){ const b=t.getBoundingClientRect(); setTimeout(()=>burst(b.left+b.width/2,b.top+b.height/2),350); haptic(25); } } }
// انداختن سؤال توی سبد: کارت کوچک می‌شود و با یک قوس می‌افتد توی دکمهٔ سبد (مثل فرستادن پست در دایرکت)
let TOSS=false;
function toBasket(){
  const c=S.practice.cur, card=$('#rvCard'); if(!c || !card || TOSS) return; TOSS=true; const i=c.qi;
  if(!S.basket.find(b=>b.qi===i&&!b.solved)) S.basket.push({ id:Date.now(), qi:i, from:`${DATA.exam.title} · ${qLabel(i)}`, my:S.exam.answers[i], sim:{ pick:c.pick }, solved:false });
  const r=card.getBoundingClientRect(), clone=card.cloneNode(true); clone.removeAttribute('id'); clone.classList.add('flying');
  card.style.visibility='hidden'; card.closest('.qwrap').classList.add('tossing'); haptic(12);
  fly(clone, r, $('#basketBtn'), {scaleTo:.04, arc:-70, dur:760, rot:-14}).then(()=>{ TOSS=false; save(); render(); kick('#basketBtn','bump'); kick('#basketBtn .cnt','pop-in'); haptic(18); setTimeout(()=>pracNext('basket'),380); });
}
function fly(node, from, toEl, {dur=700, scaleTo=.08, arc=-60, rot=-10}={}){
  return new Promise(res=>{
    if(!toEl || reduced()){ res(); return; }
    const t=toEl.getBoundingClientRect(), dx=t.left+t.width/2-(from.left+from.width/2), dy=t.top+t.height/2-(from.top+from.height/2);
    Object.assign(node.style,{position:'fixed',left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',margin:'0',zIndex:50,pointerEvents:'none',transformOrigin:'center'});
    document.body.appendChild(node);
    const a=node.animate([
      {transform:'translate(0,0) scale(1) rotate(0)', opacity:1},
      {transform:`translate(0,6px) scale(.94) rotate(0)`, opacity:1, offset:.12},
      {transform:`translate(${dx*.35}px,${dy*.35+arc}px) scale(${(1+scaleTo)/2.4}) rotate(${rot/2}deg)`, opacity:1, offset:.5},
      {transform:`translate(${dx}px,${dy}px) scale(${scaleTo}) rotate(${rot}deg)`, opacity:.5}],
      {duration:dur, easing:'cubic-bezier(.5,0,.3,1)'});
    a.onfinish=()=>{ node.remove(); res(); };
  });
}

/* ---------- مسیر سرعت (تمرین دفترچهٔ ۲): سؤال‌های مشابه با زمان کم و سه جون ---------- */
let G=null;
const speedKinds = t => [...new Set(Q.filter(q=>q.b===1&&q.t===t).map(q=>q.k))];
// هر بار سؤال‌های تازه از همان دسته
function speedDeck(t, seed=(Date.now()%1e9)|0){ const r=rngOf(seed), ks=speedKinds(t), out=[], seen=new Set();
  for(let g=0; out.length<SPEED.n && g<300; g++){ const x=GEN[ks[g%ks.length]](rngOf(ri(r,1,1e9))); if(seen.has(x.q)) continue; seen.add(x.q); out.push(x); } return out; }
const hearts = n => `<span class="hearts" role="img" aria-label="${fa(n)} جون">${[0,1,2].map(i=>`<i class="${i<n?'':'off'}">${I.heart}</i>`).join('')}</span>`;
const secs = ms => fa1(ms/1000);
function speedStart(){ const t=route.p.t; G={ t, qs:speedDeck(t), k:0, lives:SPEED.lives, pick:null, res:[], streak:0, used:0, phase:'count', count:3 }; const g=G; render(); haptic();
  const step=()=>{ if(G!==g||route.name!=='speed') return; if(--g.count>0){ render(); kick('.gcount b','pop-in'); haptic(); setTimeout(step,650); } else speedAsk(); }; setTimeout(step,650); }
function speedAsk(){ G.phase='play'; G.pick=null; G.endsAt=Date.now()+SPEED.secs*1000; render(); kick('.qwrap','q-next'); requestAnimationFrame(speedTick); }
function speedTick(){ if(!G||G.phase!=='play'||G.frozen||route.name!=='speed') return; const left=G.endsAt-Date.now(), bar=$('#gbar');
  if(bar){ bar.style.width=Math.max(0,left/(SPEED.secs*10))+'%'; bar.parentNode.classList.toggle('low',left<5000); const n=$('#gsec'); if(n) n.textContent=fa(Math.max(0,Math.ceil(left/1000))); }
  if(left<=0) return speedAnswer(-1); requestAnimationFrame(speedTick); }
function speedAnswer(j){ if(!G||G.phase!=='play') return; const g=G, q=g.qs[g.k], right=j===q.a;
  g.used+=Math.min(SPEED.secs*1000, SPEED.secs*1000-(g.endsAt-Date.now())); g.pick=j; g.phase='fb'; g.res.push(right?'ok':'bad');
  if(right){ g.streak++; } else { g.lives--; g.streak=0; }
  render();
  if(right){ haptic(12); const o=document.querySelectorAll('.gopts .opt')[j]; if(o){ const r=o.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); } if(g.streak>=2) kick('.streak','pop-in'); }
  else { haptic(40); kick('.gcard','shake'); kick('.hearts i.off:first-of-type','pop-in'); const hs=document.querySelectorAll('.hearts i'); if(hs[g.lives]) kick(hs[g.lives],'heart-break'); }
  setTimeout(()=>{ if(G!==g||route.name!=='speed') return;
    if(g.lives<=0){ g.phase='lost'; const s=S.practice.speed[g.t]||(S.practice.speed[g.t]={}); s.tries=(s.tries||0)+1; save(); NAV='fwd'; render(); haptic(50); }
    else if(g.k>=g.qs.length-1){ const s=S.practice.speed[g.t]||(S.practice.speed[g.t]={}); g.record=!s.best||g.used<s.best; s.won=true; s.best=g.record?g.used:s.best; s.tries=(s.tries||0)+1; g.phase='won'; save(); NAV='fwd'; render(); speedCheer(); }
    else { g.k++; speedAsk(); } }, right?600:1300);

function makePdf(pages){ // هر صفحه یک تصویر JPEG تمام‌صفحه (A4)
  const enc=new TextEncoder(), parts=[], offs=[]; let pos=0;
  const push=x=>{ const u=typeof x==='string'?enc.encode(x):x; parts.push(u); pos+=u.length; };
  const obj=(n,body)=>{ offs[n]=pos; push(`${n} 0 obj\n`); body(); push(`\nendobj\n`); };
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${pages.length} >>`));
  pages.forEach((j,i)=>{ const p=3+i*3, content='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${p+1} 0 R >> >> /Contents ${p+2} 0 R >>`));
    obj(p+1,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.data.length} >>\nstream\n`); push(j.data); push('\nendstream'); });
    obj(p+2,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)); });
  const xref=pos, n=3+pages.length*3; push(`xref\n0 ${n}\n0000000000 65535 f \n`);
  for(let i=1;i<n;i++) push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
const loadImg = src => new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
async function basketPages(){

  await (document.fonts && document.fonts.ready);
  let c, x, y;
  const F=(w,px)=>x.font=`${w} ${px}px "Yekan Bakh", Tahoma, sans-serif`;
  const txt=(t,X,Y,col=INK,al='right')=>{ x.fillStyle=col; x.textAlign=al; x.fillText(t,X,Y); };
  const wrap=(t,maxW)=>{ const out=[]; let line=''; String(t).replace(/ /g,' ').split(' ').forEach(w=>{ const tr=line?line+' '+w:w; if(x.measureText(tr).width>maxW && line){ out.push(line); line=w; } else line=tr; }); if(line) out.push(line); return out; };
  const para=(t,X,maxW,lh,dry,col)=>{ wrap(t,maxW).forEach(l=>{ if(!dry) txt(l,X,y+lh*.72,col); y+=lh; }); };
  const page=()=>{ c=document.createElement('canvas'); c.width=W; c.height=H; x=c.getContext('2d'); x.direction='rtl'; x.fillStyle='#fff'; x.fillRect(0,0,W,H); pages.push(c); y=M; };
  const opts=(q,pick,dry,X,maxW)=>{
    if(q.oi){ const S2=170, gap=24; q.o.forEach((o,j)=>{ const X0=X-(j+1)*S2-j*gap; if(!dry){ if(imgs[q.oi[j]]) x.drawImage(imgs[q.oi[j]],X0,y,S2,S2); if(pick===j){ x.lineWidth=6; x.strokeStyle='#947EDC'; x.beginPath(); x.roundRect(X0-6,y-6,S2+12,S2+12,26); x.stroke(); } F(700,26); txt(fa(j+1)+(pick===j?' · جواب من':''),X0+S2/2,y+S2+36,pick===j?'#4B3A92':MUT,'center'); } }); y+=S2+60; return; }
    q.o.forEach((o,j)=>{ F(pick===j?800:500,27); const mine=pick===j; if(!dry && mine){ const h=wrap(`${fa(j+1)}) ${o}`,maxW-230).length*40; x.fillStyle='#E9E3F8'; x.beginPath(); x.roundRect(X-maxW,y-4,maxW,h+8,14); x.fill(); F(800,24); txt('جواب من',X-maxW+20,y+27,'#4B3A92','left'); F(800,27); }
      para(`${fa(j+1)}) ${o}`,X-16,maxW-230,40,dry); y+=4; });
  };
  const item=(b,n,dry)=>{ const q=Q[b.qi], y0=y;
    if(!dry){ x.fillStyle=INK; x.beginPath(); x.arc(W-M-26,y+26,26,0,7); x.fill(); F(900,28); txt(fa(n),W-M-26,y+36,'#fff','center'); F(600,26); txt(b.from,W-M-70,y+35,MUT); } y+=74;
    F(800,31); para(q.q,W-M,CW,50,dry); y+=6;
    if(q.img && imgs[q.img]){ const im=imgs[q.img], w=Math.min(CW,760), h=w*im.height/im.width; if(!dry) x.drawImage(im,W-M-w,y,w,h); y+=h+20; }
    opts(q,b.my,dry,W-M,CW);
    if(b.my===null){ F(700,28); para('جواب من: این سؤال رو توی آزمون جواب نداده بودم.',W-M,CW,46,dry,'#8A3E26'); }
    if(b.sim){ const sq=SIM(b.qi); y+=14; const yb=y; let hb=0;
      const inner=d=>{ y=yb+26; F(700,24); para('سؤال مشابهی که توی تمرین حل کردم',W-M-30,CW-60,40,d,MUT); F(700,27); para(sq.q,W-M-30,CW-60,42,d); y+=4; opts(sq,b.sim.pick,d,W-M-30,CW-60); y+=14; };
      inner(true); hb=y-yb; if(!dry){ x.fillStyle='#F7F5F1'; x.beginPath(); x.roundRect(M,yb,CW,hb,24); x.fill(); inner(false); } y=yb+hb; }
    y+=22; if(!dry){ x.fillStyle='#D6D0C6'; x.fillRect(M,y,CW,2); } y+=28; return y-y0; };
  page(); F(900,54); txt('از معلم می‌پرسم',W-M,y+50); y+=84; F(500,28); txt(`${s.first} ${s.last} · پایهٔ ${s.grade} · ${s.school}`,W-M,y+24,MUT); y+=44; txt(`${DATA.exam.title} · ${fa(items.length)} سؤال`,W-M,y+24,MUT); y+=60; x.fillStyle=INK; x.fillRect(M,y,CW,4); y+=44;
  items.forEach((b,i)=>{ const keep=y; const h=item(b,i+1,true); y=keep; if(y+h>H-M-40 && y>M+10) page(); item(b,i+1,false); });
  pages.forEach((cv,i)=>{ const g=cv.getContext('2d'); g.direction='rtl'; g.font='500 24px "Yekan Bakh", Tahoma, sans-serif'; g.fillStyle=MUT; g.textAlign='center'; g.fillText(`صفحهٔ ${fa(i+1)} از ${fa(pages.length)}`,W/2,H-50); });

    ${open.length?open.map(b=>`<button class="list-item" onclick="go('basketItem',{id:${b.id}})"><span class="grow"><b class="small">${Q[b.qi].q}</b><br><span class="muted small">${b.from}${b.sim?' · با یک سؤال مشابه':''}</span></span><span class="chev">${I.chev}</span></button>`).join('')
      :empty(ART.bubble,'سبدت خالیه','وقتی توی تمرین سؤالی برات جا نیفتاد، بندازش توی سبد تا از معلمت بپرسی.')}
    ${solved?`<p class="muted small center">${fa(solved)} سؤال حل‌شده از سبد بیرون رفته.</p>`:''}
  </div>${open.length?actions(`<button class="btn btn-primary" onclick="basketPdf()">${I.down}دانلود PDF سؤال‌ها و جواب‌هام</button>`):''}`; };
V.basketItem = () => { const b=S.basket.find(x=>x.id===route.p.id); if(!b) return V.basket(); const q=Q[b.qi];
  return `<div class="screen no-nav has-act stack">${topbar('سؤال من')}
    <div class="row between"><span class="badge">${b.from}</span><span class="muted small">سؤال اصلی آزمون</span></div>
    ${qBody(q)}
    <div class="${optsCls(q)}">${q.o.map((o,j)=>staticOpt(q,j,b.my,true)).join('')}</div>
    ${b.sim?(sq=>`<span class="cap sec">سؤال مشابهی که توی تمرین حل کردی</span><div class="card linked"><p class="q-text sm">${nob(sq.q)}</p><div class="stack" style="margin-top:10px">${sq.o.map((o,j)=>staticOpt(sq,j,b.sim.pick,true)).join('')}</div></div>`)(SIM(b.qi)):''}
    <div class="note">${I.info}<span>این سؤال رو سر کلاس یا از همون راهی که با معلمت در ارتباطی بپرس.</span></div>
    <b>اشکالت رفع شد؟</b>
  </div>${actions(`<button class="btn btn-primary" onclick="solve(${b.id})">آره، حل شد</button><div class="row2"><button class="btn btn-ghost" onclick="back();toast('سؤال برای پیگیری توی سبد می‌مونه')">هنوز نه</button><button class="btn btn-ghost btn-danger" onclick="removeItem(${b.id})">حذف از سبد</button></div>`)}`; };
function solve(id){ S.basket.find(x=>x.id===id).solved=true; save(); back(); toast('از فهرست حل‌نشده‌ها بیرون رفت'); burst(innerWidth/2,160); haptic(20); }
function removeItem(id){ S.basket=S.basket.filter(x=>x.id!==id); save(); back(); toast('از سبد حذف شد'); }

/* ============ رندر و تایمر ============ */
function render(){
  const html=(V[route.name]||V.home)(), app=$('#app');
  if(NAV || !app.firstChild){
    app.innerHTML=html;
    const sc=app.querySelector('.screen'), kind=NAV||'tab';
    if(sc){ sc.classList.add('enter-'+kind); if(kind==='tab') [...sc.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,8))); }
    growBars(app); countUp(app); NAV=null;
    if(route.name==='story') storyFx();
    sbar();
    if(route.name==='home') bnDots();
  } else { const t=document.createElement('div'); t.innerHTML=html; morphKids(app,t); }
  if(route.name==='otp') tickResend();
  if(route.name==='welcome') bindSwipe();
  document.body.classList.toggle('scrolled', scrollY>4);
}
window.addEventListener('scroll',()=>document.body.classList.toggle('scrolled', scrollY>4),{passive:true});
let TICK=0;
setInterval(()=>{
  if(route.name==='otp') tickResend();
  if(route.name==='home' && ++TICK%5===0) bnAuto();
  const e=S.exam; if(e.status!=='inProgress' || !e.endsAt[e.booklet]) return;
  const left=timeLeft();
  if(left<=0){ if(e.booklet<BOOKLETS.length-1) goNextBooklet(true); else submitExam(true); return; }
  const t=$('#timer'); if(t){ t.textContent=mmss(left); t.classList.toggle('low',left<180000); }
},1000);
/* ---------- نشانگر اسکرول داخل اپ (به‌جای اسکرول‌بار مرورگر) ---------- */
let SB_T=0;
function sbar(show){
  let el=$('#sbar'); if(!el){ el=document.createElement('div'); el.id='sbar'; el.innerHTML='<i></i>'; el.setAttribute('aria-hidden','true'); document.body.appendChild(el); }
  const doc=document.documentElement, H=innerHeight, full=doc.scrollHeight, app=$('#app').getBoundingClientRect();
  if(full<=H+4){ el.classList.remove('on'); return; }
  const top=10, track=H-20, th=Math.max(36, track*H/full), y=top+(track-th)*(scrollY/(full-H));
  el.style.left=(app.left+3)+'px'; el.firstChild.style.cssText=`height:${th}px;transform:translateY(${y}px)`;
  if(show){ el.classList.add('on'); clearTimeout(SB_T); SB_T=setTimeout(()=>el.classList.remove('on'),900); }
}
addEventListener('scroll',()=>sbar(true),{passive:true}); addEventListener('resize',()=>sbar());

/* ============ ابزار پیش‌نمایش (preview.html از این‌ها استفاده می‌کند) ============ */
const DEV_PERF = { strong:[.9,.04], mid:[.6,.16], weak:[.34,.26] };
function devFill(perf){ const P=DEV_PERF[perf]||DEV_PERF.mid, r=rngOf((perf||'mid').length*97+5);
  S.exam=freshExam(); S.exam.status='published'; S.exam.passed=S.exam.passed.map(()=>true);
  S.exam.answers=Q.map(q=>{ const pc=Math.min(.98,Math.max(.05,P[0]+(q.rate-.45)*.6)), u=r(); return u<pc ? q.a : u<pc+P[1] ? null : (q.a+1+Math.floor(r()*3))%4; }); }
function devUser(){ if(S.loggedIn && S.profile) return; S.loggedIn=true; S.phone='09121112233'; if(!S.registered.includes(S.phone)) S.registered.push(S.phone); loadUser(S.phone,true);
  S.profile={ first:'سارا', last:'احمدی', grade:'ششم', province:'تهران', city:'تهران', school:'دبستان فرهنگ', gender:'دختر', birth:{y:1393,m:5,d:12}, nid:'0012345679' }; S.avatar=10; }
function devGo(id, perf){
  closeSheet(); stack=[]; G=null; const [g,a]=id.split(':'); let name=g, p={}, after=null;
  const auth=()=>{ if(S.loggedIn){ stashUser(); S.loggedIn=false; } L={mode:'login',phone:'',otp:'',err:'',resendAt:0}; R=freshR(); };
  const pub=()=>{ devUser(); devFill(perf); S.story=null; S.practice=freshPractice(); S.basket=[]; };
  const seen=()=>{ pub(); S.story={step:STEPS().length-1,done:true}; };
  const sit=b=>{ devUser(); S.exam=freshExam(); S.exam.status='inProgress'; S.exam.booklet=b; if(b) QB(0).forEach(q=>S.exam.passed[q.i]=true); S.exam.endsAt[b]=Date.now()+DATA.exam.booklets[b].minutes*60000-(b?0:754000); name='exam'; };
  const drill=(n,mode)=>{ const w=result().wrong.filter(i=>Q[i].b===0); w.slice(0,n).forEach((i,k)=>{ const bk=mode==='mix'&&k%3===2; S.practice.res[i]=bk?'basket':'ok'; if(bk) S.basket.push({id:1000+i,qi:i,from:`${DATA.exam.title} · ${qLabel(i)}`,my:S.exam.answers[i],sim:{pick:(SIM(i).a+1)%4},solved:false}); }); if(n>=999) speedTopics().forEach((t,k)=>S.practice.speed[t]={won:true,best:61000+k*9000,tries:2}); };
  if(g==='login'){ auth(); }
  else if(g==='unregistered'){ auth(); L.phone=DATA.login.unregistered; }
  else if(g==='otp'){ auth(); L.phone='09121112233'; L.resendAt=Date.now()+60000; }
  else if(g==='invite'){ auth(); }
  else if(g==='register'){ auth(); name='register'; Object.assign(R,{step:+a,invite:'AZ1405',first:'سارا',last:'احمدی',nid:'0012345679'}); if(+a>1) Object.assign(R,{birth:{y:1393,m:5,d:12},gender:'دختر'}); if(+a>2) Object.assign(R,{grade:'ششم',province:'تهران',city:'تهران',school:'دبستان فرهنگ'}); }
  else if(g==='welcome'){ devUser(); W=+a||0; }
  else if(g==='home'){ name='home';
    if(a==='available'){ devUser(); S.exam=freshExam(); S.story=null; S.practice=freshPractice(); S.basket=[]; }
    if(a==='progress'){ sit(0); name='home'; }
    if(a==='wait'){ pub(); S.exam.status='submitted'; }
    if(a==='new') pub();
    if(a==='story'){ pub(); S.story={step:2,done:false}; }
    if(a==='practice'){ seen(); drill(7,'mix'); }
    if(a==='done'){ seen(); drill(999,'mix'); } }
  else if(g==='rules'){ devUser(); S.exam=freshExam(); }
  else if(g==='exam'){ sit(a==='b2'||a==='img2'||a==='last'?1:0); const e=S.exam;
    if(a==='img') e.idx[0]=7; if(a==='img2') e.idx[1]=2; if(a==='long') e.idx[0]=14;
    if(a==='mid'){ QB(0).slice(0,22).forEach((q,k)=>{ e.passed[q.i]=true; if(k%5!==3) e.answers[q.i]=(q.a+(k%4===0?1:0))%4; if(k%7===2) e.flags[q.i]=true; }); e.idx[0]=22; }
    if(a==='grid'){ QB(0).slice(0,22).forEach((q,k)=>{ e.passed[q.i]=true; if(k%5!==3) e.answers[q.i]=q.a; if(k%7===2) e.flags[q.i]=true; }); e.idx[0]=22; after=examGrid; }
    if(a==='last'){ QB(1).forEach((q,k)=>{ e.passed[q.i]=true; if(k%6) e.answers[q.i]=q.a; }); e.idx[1]=NB[1]-1; after=finishExam; } }
  else if(g==='done'){ pub(); S.exam.status='submitted'; }
  else if(g==='story'){ pub(); const n=STEPS(), k=Math.max(0,n.indexOf(a)); S.story={step:k,done:k===n.length-1}; }
  else if(g==='practice'){ seen(); const lv=nextLevel()||'easy'; p={lv}; const c=pracCur(lv);
    if(c && a!=='explain' && a!=='end'){ const sq=SIM(c.qi); c.phase=a; if(a==='ok') c.pick=sq.a; if(a==='no') c.pick=(sq.a+1)%4; }
    if(a==='end'){ pracList(lv).forEach((i,k)=>{ const bk=k%3===1; S.practice.res[i]=bk?'basket':'ok'; if(bk) S.basket.push({id:1000+i,qi:i,from:`${DATA.exam.title} · ${qLabel(i)}`,my:S.exam.answers[i],sim:{pick:(SIM(i).a+1)%4},solved:false}); }); S.practice.cur=null; } }
  else if(g==='speed'){ seen(); const t=speedTopics()[0]||'numbers'; p={t}; const deck=speedDeck(t,4242);
    if(a==='intro') G={t,phase:'intro'};
    if(a==='count') G={t,qs:deck,k:0,lives:3,res:[],streak:0,used:0,phase:'count',count:2,frozen:true};
    if(a==='play') G={t,qs:deck,k:3,lives:2,res:['ok','ok','bad'],streak:0,used:21000,phase:'play',frozen:true,endsAt:Date.now()+9400};
    if(a==='streak') G={t,qs:deck,k:4,lives:3,res:['ok','ok','ok','ok','ok'],streak:5,used:24000,pick:deck[4].a,phase:'fb',frozen:true,endsAt:Date.now()+9000};
    if(a==='wrong') G={t,qs:deck,k:5,lives:1,res:['ok','bad','ok','ok','bad','bad'],streak:0,used:40000,pick:(deck[5].a+1)%4,phase:'fb',frozen:true,endsAt:Date.now()+3000};
    if(a==='lost') G={t,qs:deck,k:5,lives:0,res:['ok','bad','ok','ok','bad','bad'],streak:0,used:40000,phase:'lost'};
    if(a==='won'){ S.practice.speed[t]={won:true,best:52300,tries:2}; G={t,qs:deck,k:7,lives:2,res:['ok','ok','bad','ok','ok','ok','ok','ok'],streak:5,used:52300,record:true,phase:'won'}; } }
  else if(g==='exams'){ if(a==='before'){ devUser(); S.exam=freshExam(); S.story=null; S.practice=freshPractice(); } else { seen(); drill(a==='done'?999:5,'mix'); } }
  else if(g==='result'){ seen(); }
  else if(g==='report'){ seen(); name='result'; after=reportSheet; }
  else if(g==='answer'){ seen(); name='result'; after=()=>showAnswer(result().wrong[0] ?? 0); }
  else if(g==='leaderboard'){ if(a==='before'){ devUser(); S.exam=freshExam(); } else seen(); }
  else if(g==='basket'){ seen(); if(a!=='empty') drill(12,'mix'); if(a==='item'){ name='basketItem'; p={id:S.basket[0].id}; stack=[{name:'basket',p:{}}]; } if(a==='pdf') after=basketPdf; }
  else if(g==='profile'){ devUser(); }
  else if(g==='logout'){ devUser(); name='profile'; after=logoutAsk; }
  else if(g==='avatar'){ devUser(); name='profile'; after=pickAvatar; }
  else if(g==='reset'){ S=fresh(); auth(); name='login'; }
  if(['practice','speed','basket','basketItem','result','story','rules'].includes(name) && !stack.length) stack=[{name:name==='practice'||name==='speed'?'exams':'home',p:{}}];
  route={name,p}; save(); NAV='tab'; render(); scrollTo(0,0);
  if(after) setTimeout(after,350);
}
window.addEventListener('message', e=>{ const d=e.data && e.data.azmoun; if(d && d.go) devGo(d.go, d.perf); });
window.DEV = devGo;

render();
</script>
